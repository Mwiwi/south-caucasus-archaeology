name: SCOAI Validation & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit test suite
        run: python3 -m unittest discover -s tests -v

      - name: Run CaucasusArch-Bench evaluation suite
        run: PYTHONPATH=. python3 benchmarks/caucasus_arch_bench.py

      - name: Verify dataset generation pipeline
        run: python3 pipeline.py --quiet
