[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scoai"
version = "0.2.0"
description = "South Caucasus Open Archaeology Initiative (SCOAI) — Radiocarbon normalization, Asomtavruli epigraphy, and spatial dataset toolkit"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Willi Ker"}
]
keywords = [
    "computational-archaeology",
    "south-caucasus",
    "georgia",
    "radiocarbon",
    "epigraphy",
    "geojson",
    "xronos",
    "pelagios",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scoai*"]
